    <circle cx="22" cy="16.5" r="0.8" fill="#ffffff" />
    <!-- Skull Cap base curve -->
    <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" fill="#ffffff" fill-opacity="0.9" />
